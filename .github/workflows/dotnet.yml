name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - name: Detect UI changes
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d  # v4.0.1
      id: ui-changes
      with:
        filters: |
          ui:
            - 'src/KRAFT.Results.Web/**'
            - 'src/KRAFT.Results.Web.Client/**'
            - 'tests/KRAFT.Results.Web.E2ETests/**'
    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Cache Playwright browsers
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      id: playwright-cache
      uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8  # v6.0.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright browsers
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      run: pwsh tests/KRAFT.Results.Web.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps
    - name: Test
      run: >-
        dotnet test --no-build --verbosity normal
        --filter "FullyQualifiedName!~KRAFT.Results.Web.E2ETests"
    - name: E2E Test
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      run: >-
        dotnet test --no-build --verbosity normal
        --filter "FullyQualifiedName~KRAFT.Results.Web.E2ETests"
