name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
      - '.editorconfig'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - name: Detect UI changes
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      id: ui-changes
      with:
        filters: |
          ui:
            - 'src/KRAFT.Results.Web/**'
            - 'src/KRAFT.Results.Web.Client/**'
            - 'tests/KRAFT.Results.Web.E2ETests/**'
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Cache Playwright browsers
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      id: playwright-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('Directory.Packages.props') }}
    - name: Install Playwright browsers
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      run: pwsh tests/KRAFT.Results.Web.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps
    - name: Test
      run: |
        # Explicit project list — update when adding a test project under tests/.
        # MTP requires explicit paths; the old solution-wide filter auto-discovered them.
        failed=0
        dotnet test tests/KRAFT.Results.WebApi.UnitTests/KRAFT.Results.WebApi.UnitTests.csproj --no-build --verbosity normal || failed=1
        dotnet test tests/KRAFT.Results.WebApi.IntegrationTests/KRAFT.Results.WebApi.IntegrationTests.csproj --no-build --verbosity normal || failed=1
        dotnet test tests/KRAFT.Results.Web.Client.Tests/KRAFT.Results.Web.Client.Tests.csproj --no-build --verbosity normal || failed=1
        exit $failed
    - name: E2E Test
      if: github.event_name == 'push' || steps.ui-changes.outputs.ui == 'true'
      run: dotnet test tests/KRAFT.Results.Web.E2ETests/KRAFT.Results.Web.E2ETests.csproj --no-build --verbosity normal
